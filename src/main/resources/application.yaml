spring:
  application:
    name: smart-task-manager

  datasource:
    url: jdbc:postgresql://localhost:5433/smart_task_manager
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          connectiontimeout: ${EMAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${EMAIL_SMTP_READ_TIMEOUT_MS:10000}
          writetimeout: ${EMAIL_SMTP_WRITE_TIMEOUT_MS:10000}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    baseline-version: 0
    clean-disabled: true
    baseline-description: "Initial baseline"
    sql-migration-prefix: V
    sql-migration-separator: __
    sql-migration-suffixes: .sql

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level correlationId=%X{correlationId:-} [%thread] %logger{36} - %msg%n"
  level:
    org.flywaydb: DEBUG

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:smart-task-manager-access}
  audience: ${JWT_AUDIENCE:smart-task-manager-api}
  expiration: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}

account-action:
  token-secret: ${ACCOUNT_ACTION_TOKEN_SECRET}
  issuer: ${ACCOUNT_ACTION_TOKEN_ISSUER:smart-task-manager-account-action}
  audience: ${ACCOUNT_ACTION_TOKEN_AUDIENCE:smart-task-manager-account-action}
  verification-expiration-ms: ${ACCOUNT_ACTION_VERIFICATION_EXPIRATION_MS:86400000}
  password-reset-expiration-ms: ${ACCOUNT_ACTION_PASSWORD_RESET_EXPIRATION_MS:1800000}

auth-rate-limit:
  max-attempts: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:5}
  window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  max-entries: ${AUTH_RATE_LIMIT_MAX_ENTRIES:10000}
  trusted-proxies: ${AUTH_RATE_LIMIT_TRUSTED_PROXIES:}

email-outbox:
  enabled: ${EMAIL_OUTBOX_ENABLED:true}
  dispatch-delay-ms: ${EMAIL_OUTBOX_DISPATCH_DELAY_MS:1000}
  link-base-url: ${EMAIL_LINK_BASE_URL:http://localhost:3000}
  require-secure-links: false
  from-address: ${EMAIL_FROM_ADDRESS:no-reply@smart-task-manager.local}
  batch-size: ${EMAIL_OUTBOX_BATCH_SIZE:20}
  maximum-attempts: ${EMAIL_OUTBOX_MAXIMUM_ATTEMPTS:5}
  stale-claim-after: ${EMAIL_OUTBOX_STALE_CLAIM_AFTER:5m}
  retry-initial-delay: ${EMAIL_OUTBOX_RETRY_INITIAL_DELAY:10s}
  retry-maximum-delay: ${EMAIL_OUTBOX_RETRY_MAXIMUM_DELAY:15m}
  smtp-connection-timeout: ${EMAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
  smtp-read-timeout: ${EMAIL_SMTP_READ_TIMEOUT_MS:10000}
  smtp-write-timeout: ${EMAIL_SMTP_WRITE_TIMEOUT_MS:10000}

ai:
  planning:
    base-url: ${AI_PLANNING_BASE_URL:http://127.0.0.1:8000}
    connect-timeout-ms: ${AI_PLANNING_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AI_PLANNING_READ_TIMEOUT_MS:180000}
  ollama:
    enabled: ${AI_ENABLED:true}
    base-url: http://127.0.0.1:11434  # ← Cambiar localhost por 127.0.0.1
    model: ${OLLAMA_MODEL:llama3.2:3b}
    timeout: 30000
    max-tokens: 1000
    temperature: 0.7
