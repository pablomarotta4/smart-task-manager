services:
  postgres:
    image: postgres:16-alpine
    container_name: smart_task_manager_db
    environment:
      POSTGRES_DB: smart_task_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_task_manager"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    container_name: smart_task_manager_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ai-service:
    profiles: ["ai"]
    build:
      context: ./ai-service
    container_name: smart_task_manager_ai
    environment:
      SMART_TASK_AI_OLLAMA_BASE_URL: http://ollama:11434
      SMART_TASK_AI_OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    ports:
      - "8000:8000"
    depends_on:
      - ollama

volumes:
  postgres_data:
  ollama_data:
